name: t
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        j: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q curl_cffi
      - run: curl -s https://api.ipify.org; echo
      - run: J=${{ matrix.j }} python tls.py 30
